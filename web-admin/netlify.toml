[build]
  command = "npm run build"
  publish = "dist"

# Redirige les appels API vers le backend Laravel sur Render
[[redirects]]
  from = "/api/*"
  to = "https://phoneshop-api.onrender.com/api/:splat"
  status = 200
  force = true

# Redirige toutes les autres routes vers index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
